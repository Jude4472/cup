<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <title>Unity WebGL Player | Cuphead</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <meta name="theme-color" content="#000000">
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      #loading-text {
        font-weight: bold;
        background: linear-gradient(
          270deg,
          #ff0000,
          #ff7f00,
          #ffff00,
          #00ff00,
          #0000ff,
          #4b0082,
          #8f00ff
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }

      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .loading-box {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 700px);
        text-align: center;
        z-index: 9999;
      }

      .progress-bar-container {
        width: 100%;
        height: 12px;
        background: rgba(255,255,255,0.13);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
        border: 2px solid rgba(255,255,255,0.22);
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8f00ff);
        transition: width 0.2s ease;
      }

      #progressText {
        color: #f0f0f0;
        margin-top: 12px;
        font-size: 18px;
        font-family: Arial, sans-serif;
      }

      #time-left {
        color: #d8d8d8;
        margin-top: 10px;
        font-size: 16px;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div id="loading-text" style="font-size: 48px; font-family: cursive; text-align: center;">LOADING...</div>

      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="progressText">0.00 MB / 2101.31 MB</div>
      <div id="time-left">Estimating time remaining...</div>
    </div>

    <div id="gameContainer"></div>

    <script src="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/Build/UnityLoader.js"></script>
    <script>
      const loadingText = document.getElementById("loading-text");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const timeLeftText = document.getElementById("time-left");

      const TOTAL_BYTES = 2101.31 * 1024 * 1024;
      const CDN_BASE = "https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/";

      let loadedBytes = 0;
      let lastEstimateBytes = 0;
      let lastEstimateTime = performance.now();

      function updateProgressUI(percent, totalLoadedBytes) {
        if (progressBar) {
          progressBar.style.width = percent + "%";
        }

        if (progressText) {
          const mb = (totalLoadedBytes / (1024 * 1024)).toFixed(2);
          progressText.textContent = `${mb} MB / 2101.31 MB`;
        }
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds <= 0) {
          return "Calculating...";
        }

        seconds = Math.ceil(seconds);
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;

        if (minutes > 0) {
          return `${minutes}m ${remainingSeconds}s remaining`;
        }

        return `${remainingSeconds}s remaining`;
      }

      function updateTimeEstimate() {
        const now = performance.now();
        const elapsedSeconds = (now - lastEstimateTime) / 1000;
        const bytesSinceLastUpdate = loadedBytes - lastEstimateBytes;

        if (elapsedSeconds <= 0 || bytesSinceLastUpdate <= 0) {
          return;
        }

        const bytesPerSecond = bytesSinceLastUpdate / elapsedSeconds;
        const bytesRemaining = Math.max(0, TOTAL_BYTES - loadedBytes);
        const secondsRemaining = bytesRemaining / bytesPerSecond;

        timeLeftText.textContent = `Estimated ${formatTime(secondsRemaining)}`;

        lastEstimateBytes = loadedBytes;
        lastEstimateTime = now;
      }

      const estimateTimer = setInterval(updateTimeEstimate, 7000);

      async function fetchWithProgress(url) {
        return fetch(url, {
          method: 'GET',
          headers: {
            'Accept-Encoding': 'gzip, deflate'
          },
          credentials: 'omit'
        }).then(async response => {
          if (!response.ok) throw new Error(`Failed to fetch ${url}`);

          const reader = response.body.getReader();
          const chunks = [];
          let chunkCount = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            loadedBytes += value.length;
            chunks.push(value);
            chunkCount++;

            if (chunkCount % 5 === 0) {
              const percent = Math.min((loadedBytes / TOTAL_BYTES) * 100, 95);
              updateProgressUI(percent, loadedBytes);
              loadingText.textContent = `LOADING... ${((loadedBytes / (1024 * 1024))).toFixed(2)} MB`;
              await new Promise(resolve => setTimeout(resolve, 0));
            }
          }

          return new Blob(chunks);
        });
      }

      async function mergeFiles(fileParts, cacheKey) {
        const cache = await caches.open("cuphead-cache-v4");
        const cachedResponse = await cache.match(cacheKey);

        if (cachedResponse) {
          console.log(`Loading ${cacheKey} from cache`);
          const blob = await cachedResponse.blob();
          return URL.createObjectURL(blob);
        }

        const blobs = [];

        for (let i = 0; i < fileParts.length; i += 2) {
          const batch = fileParts.slice(i, i + 2);
          const batchBlobs = await Promise.all(
            batch.map(part => fetchWithProgress(part))
          );
          blobs.push(...batchBlobs);

          if ((i + 2) % 20 === 0) {
            await new Promise(resolve => setTimeout(resolve, 50));
          }
        }

        const mergedBlob = new Blob(blobs);
        const response = new Response(mergedBlob);

        cache.put(cacheKey, response.clone()).catch(() => {});

        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(CDN_BASE + file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        try {
          console.log("Starting Cuphead game load...");

          loadingText.textContent = "LOADING... Data files...";
          const dataUrl = await mergeFiles(
            getParts("Build/CupheadPort.data.unityweb", 1, 103),
            "CupheadPort.data.unityweb"
          );

          loadingText.textContent = "LOADING... WASM files...";
          const wasmUrl = await mergeFiles(
            getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2),
            "CupheadPort.wasm.code.unityweb"
          );

          loadingText.textContent = "LOADING... ASM files...";
          const asmUrl = await mergeFiles(
            getParts("Build/CupheadPort.asm.code.unityweb", 1, 3),
            "CupheadPort.asm.code.unityweb"
          );

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (url.includes("CupheadPort.data.unityweb")) {
              url = dataUrl;
            } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
              url = wasmUrl;
            } else if (url.includes("CupheadPort.asm.code.unityweb")) {
              url = asmUrl;
            }
            return originalOpen.call(this, method, url, ...rest);
          };

          loadingText.textContent = "LOADING... Initializing...";
          clearInterval(estimateTimer);
          timeLeftText.textContent = "Loading complete!";

          var unityInstance = UnityLoader.instantiate(
            "gameContainer",
            CDN_BASE + "Build/CupheadPort.json"
          );

          document.querySelector(".loading-box").style.display = "none";
        } catch (e) {
          console.error("Error loading game:", e);
          loadingText.textContent = "Error loading game.";
          timeLeftText.textContent = "Please refresh the page.";
        }
      })();
    </script>
  </body>
</html>
